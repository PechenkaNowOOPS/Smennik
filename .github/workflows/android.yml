name: Android Alpha CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and assemble
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smennik-0.1.0-alpha.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
