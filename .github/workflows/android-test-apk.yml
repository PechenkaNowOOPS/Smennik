name: Android test APK (temporary signing)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-test-apk.yml'

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check version
        run: python3 scripts/check_version.py
      - name: Test and build temporary signed debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify APK is installable and signed
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" |
            tee /tmp/apk-verification.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apk-verification.txt
          echo "VERSION=$(sed -n 's/^versionName=//p' version.properties)" >> "$GITHUB_ENV"
      - name: Upload installable TEST apk (not an update!)
        uses: actions/upload-artifact@v4
        with:
          name: Smennik-${{ env.VERSION }}-TEST-APK-UNSTABLE-SIGNING
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
